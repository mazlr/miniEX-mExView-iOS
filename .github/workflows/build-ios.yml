name: Build iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show toolchain
        run: xcodebuild -version

      - name: Validate project
        run: xcodebuild -list -project miniEXView.xcodeproj

      - name: Build for physical iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project miniEXView.xcodeproj \
            -scheme miniEXView \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIGURATION-iphoneos/miniEXView.app"
          test -d "$APP_PATH"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          test -n "$EXECUTABLE"
          test -f "$APP_PATH/$EXECUTABLE"
          file "$APP_PATH/$EXECUTABLE" | grep -q 'arm64'
          mkdir -p Payload
          ditto "$APP_PATH" Payload/miniEXView.app
          ditto -c -k --sequesterRsrc --keepParent Payload miniEXView-unsigned.ipa

      - name: Verify IPA executable
        run: |
          rm -rf verify-ipa
          ditto -x -k miniEXView-unsigned.ipa verify-ipa
          test -f verify-ipa/Payload/miniEXView.app/miniEXView
          file verify-ipa/Payload/miniEXView.app/miniEXView | grep -q 'arm64'

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: miniEXView-v0.9.1-build2-iPhone-unsigned-${{ env.CONFIGURATION }}
          path: miniEXView-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miniEXView-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
