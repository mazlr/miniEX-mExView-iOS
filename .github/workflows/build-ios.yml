name: Build iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show toolchain
        run: xcodebuild -version

      - name: Validate project
        run: xcodebuild -list -project miniEXView.xcodeproj

      - name: Replay captured miniEX traffic
        run: |
          python3 tools/verify_logs.py
          python3 tools/verify_replay_resources.py

      - name: Run protocol and RC decoder tests
        run: |
          set -o pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for group in d.values() for x in group if "iP[...]
          xcodebuild test \
            -project miniEXView.xcodeproj \
            -scheme miniEXView \
?